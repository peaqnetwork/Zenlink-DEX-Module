[package]
name = "zenlink-protocol-runtime-api"
version = "0.4.5"
authors = ["Zenlink Developers"]
edition = "2021"
license = "Apache 2.0"

[dependencies]
# alias "parity-scale-code" to "codec"
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }

sp-api = { git = "file:///tmp/claude-1000/-home-jaypan-Work-peaq-peaq-eu-dpp-adapter/f0f1296d-9a73-467a-8bc7-c2145faf448a/scratchpad/sdk/polkadot-sdk", default-features = false, branch = "peaq-polkadot-stable2603-8" }
sp-std = { git = "file:///tmp/claude-1000/-home-jaypan-Work-peaq-peaq-eu-dpp-adapter/f0f1296d-9a73-467a-8bc7-c2145faf448a/scratchpad/sdk/polkadot-sdk", default-features = false, branch = "peaq-polkadot-stable2603-8" }

zenlink-protocol = { path = '../..', default-features = false }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["std"]
std = [
    'codec/std',
    'sp-api/std',
    'sp-std/std',
    'zenlink-protocol/std'
]
